<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Architecture of bd-number-validator: a React app uses PhoneInputBd and useBdPhone from the react entry, which call the framework-free core; a server calls the core directly without React.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- consumers -->
    <rect x="110" y="20" width="220" height="48" rx="10" fill="#2563eb"/>
    <text x="220" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Your React app</text>

    <rect x="580" y="20" width="250" height="48" rx="10" fill="#7c3aed"/>
    <text x="705" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Your server · script · edge</text>

    <path d="M 220 68 L 220 108" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 705 68 L 705 298" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="718" y="170" font-size="12" fill="#64748b">React is never</text>
    <text x="718" y="188" font-size="12" fill="#64748b">loaded on this path</text>

    <!-- react entry -->
    <rect x="60" y="110" width="420" height="150" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="76" y="132" font-size="13" font-weight="600" fill="#64748b">bd-number-validator/react</text>

    <rect x="90" y="145" width="170" height="46" rx="8" fill="#4f46e5"/>
    <text x="175" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">PhoneInputBd</text>

    <rect x="300" y="145" width="150" height="46" rx="8" fill="#4f46e5"/>
    <text x="375" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">useBdPhone</text>

    <path d="M 262 168 L 296 168" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="270" y="225" text-anchor="middle" font-size="12" fill="#64748b">renders BdFlag · inline styles · no CSS import</text>
    <text x="270" y="243" text-anchor="middle" font-size="12" fill="#64748b">knows nothing about any form library</text>

    <!-- core -->
    <rect x="60" y="300" width="770" height="150" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="76" y="322" font-size="13" font-weight="600" fill="#64748b">bd-number-validator · core · zero dependencies · no React</text>

    <rect x="90" y="345" width="210" height="46" rx="8" fill="#059669"/>
    <text x="195" y="373" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">validatePhoneNumber</text>

    <rect x="330" y="345" width="180" height="46" rx="8" fill="#059669"/>
    <text x="420" y="373" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">formatBdPhoneUi</text>

    <rect x="540" y="345" width="180" height="46" rx="8" fill="#059669"/>
    <text x="630" y="373" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">detectOperator</text>

    <text x="445" y="425" text-anchor="middle" font-size="12" fill="#64748b">{ isValid, normalized, local, operator, error, code }</text>

    <!-- hook to core -->
    <path d="M 375 193 L 375 270 L 195 270 L 195 343" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
