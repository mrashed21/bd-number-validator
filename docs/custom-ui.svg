<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Custom UI: useBdPhone returns raw, formatted, normalized, operator, error, isValid, isComplete, onChange and reset, which you wire into your own input, operator badge and error text.">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <rect x="280" y="18" width="200" height="48" rx="10" fill="#4f46e5"/>
    <text x="380" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">useBdPhone()</text>

    <path d="M 380 66 L 380 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>

    <rect x="50" y="88" width="660" height="38" rx="6" fill="#e2e8f0"/>
    <text x="380" y="112" text-anchor="middle" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#0f172a">raw · formatted · normalized · local · operator · error · code · isValid · isComplete · onChange · reset</text>

    <path d="M 380 126 L 380 160 L 150 160 L 150 196" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>
    <path d="M 380 126 L 380 196" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>
    <path d="M 380 126 L 380 160 L 610 160 L 610 196" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>

    <rect x="60" y="198" width="180" height="48" rx="8" fill="#2563eb"/>
    <text x="150" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Your input</text>
    <text x="150" y="238" text-anchor="middle" font-size="11" fill="#dbeafe">formatted + onChange</text>

    <rect x="290" y="198" width="180" height="48" rx="8" fill="#059669"/>
    <text x="380" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Operator badge</text>
    <text x="380" y="238" text-anchor="middle" font-size="11" fill="#d1fae5">operator</text>

    <rect x="520" y="198" width="180" height="48" rx="8" fill="#dc2626"/>
    <text x="610" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Error text</text>
    <text x="610" y="238" text-anchor="middle" font-size="11" fill="#fee2e2">error + code</text>

    <rect x="60" y="285" width="640" height="72" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="380" y="313" text-anchor="middle" font-size="13" fill="#64748b">No packaged markup, no CSS, no class names — you own every element.</text>
    <text x="380" y="336" text-anchor="middle" font-size="13" fill="#64748b">PhoneInputBd is just one opinionated UI built on top of this same hook.</text>
  </g>
</svg>
