<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bd-number-validator preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-border: rgba(148, 163, 184, 0.28);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(15, 118, 110, 0.14),
            transparent 34%
          ),
          radial-gradient(
            circle at top right,
            rgba(2, 132, 199, 0.12),
            transparent 30%
          ),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      }

      .shell {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .card {
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        padding: 32px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.09);
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        max-width: 58ch;
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 28px;
        margin-top: 28px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 22px;
      }

      .preview-stack {
        display: grid;
        gap: 16px;
      }

      .preview-stack .PhoneInputBd {
        width: 100%;
      }

      .stats {
        display: grid;
        gap: 12px;
      }

      .stat {
        padding: 14px 16px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .stat small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .stat strong {
        font-size: 14px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .primary {
        background: #111827;
        color: #fff;
      }

      .secondary {
        background: rgba(15, 23, 42, 0.06);
        color: var(--text);
      }

      .note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 22px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useMemo, useState } from "react";
      import { createRoot } from "react-dom/client";
      import { PhoneInputBd } from "../dist/react.js";

      function App() {
        const [value, setValue] = useState("01781131905");
        const [showError, setShowError] = useState(true);
        const [externalError, setExternalError] = useState(false);

        const error = externalError ? "Phone number already in use" : undefined;

        const details = useMemo(
          () => ({
            raw: value,
            length: value.length,
          }),
          [value],
        );

        return React.createElement(
          "main",
          { className: "shell" },
          React.createElement(
            "section",
            { className: "card" },
            React.createElement(
              "span",
              { className: "eyebrow" },
              "React input preview",
            ),
            React.createElement("h1", null, "Shadcn-like phone field"),
            React.createElement(
              "p",
              null,
              "This is the live browser preview for the updated PhoneInputBd UI. Errors render below the field, and the input stays clean.",
            ),
            React.createElement(
              "div",
              { className: "grid" },
              React.createElement(
                "div",
                { className: "panel preview-stack" },
                React.createElement(PhoneInputBd, {
                  label: "Mobile number",
                  value,
                  onChange: setValue,
                  showError,
                  error,
                  className: "PhoneInputBd",
                }),
                React.createElement(
                  "div",
                  { className: "actions" },
                  React.createElement(
                    "button",
                    { className: "primary", onClick: () => setValue("012") },
                    "Set invalid number",
                  ),
                  React.createElement(
                    "button",
                    {
                      className: "secondary",
                      onClick: () => setValue("01781131905"),
                    },
                    "Reset valid number",
                  ),
                  React.createElement(
                    "button",
                    {
                      className: "secondary",
                      onClick: () => setShowError((next) => !next),
                    },
                    showError ? "Hide built-in error" : "Show built-in error",
                  ),
                  React.createElement(
                    "button",
                    {
                      className: "secondary",
                      onClick: () => setExternalError((next) => !next),
                    },
                    externalError ? "Clear custom error" : "Use custom error",
                  ),
                ),
              ),
              React.createElement(
                "div",
                { className: "panel stats" },
                React.createElement(
                  "div",
                  { className: "stat" },
                  React.createElement("small", null, "Current value"),
                  React.createElement("strong", null, value || "(empty)"),
                ),
                React.createElement(
                  "div",
                  { className: "stat" },
                  React.createElement("small", null, "Length"),
                  React.createElement("strong", null, String(details.length)),
                ),
                React.createElement(
                  "div",
                  { className: "stat" },
                  React.createElement("small", null, "Error mode"),
                  React.createElement(
                    "strong",
                    null,
                    externalError
                      ? "External error prop"
                      : showError
                        ? "Built-in validation"
                        : "Hidden",
                  ),
                ),
                React.createElement(
                  "p",
                  { className: "note" },
                  "Tip: type 012 to see the built-in validation message below the input.",
                ),
              ),
            ),
          ),
        );
      }

      createRoot(document.getElementById("root")).render(
        React.createElement(App),
      );
    </script>
  </body>
</html>
