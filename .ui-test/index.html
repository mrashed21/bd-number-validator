<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PhoneInputBd vs shadcn/ui</title>
    <style>
      /* shadcn/ui v4 — neutral base theme, resolved from oklch to sRGB */
      :root {
        --background: #ffffff;
        --foreground: #0a0a0a;
        --muted: #f5f5f5;
        --muted-foreground: #737373;
        --border: #e5e5e5;
        --input: #e5e5e5;
        --ring: #a1a1a1;
        --destructive: #e7000b;
        --primary: #171717;
        --primary-foreground: #fafafa;
        --radius: 0.625rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      /* --- verbatim shadcn utilities ------------------------------------- */

      /* FormItem = grid gap-2 */
      .form-item {
        display: grid;
        gap: 8px;
      }

      /* Label = text-sm font-medium leading-none */
      .label {
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        color: var(--foreground);
      }
      .label[data-error="true"] {
        color: var(--destructive);
      }

      /* Input = h-9 w-full rounded-md border border-input bg-transparent
         px-3 py-1 text-sm shadow-xs transition-[color,box-shadow] outline-none */
      .input {
        display: flex;
        height: 36px;
        width: 100%;
        min-width: 0;
        border-radius: calc(var(--radius) - 2px);
        border: 1px solid var(--input);
        background: transparent;
        padding: 4px 12px;
        font-size: 14px;
        font-family: inherit;
        color: var(--foreground);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        transition:
          color 0.15s cubic-bezier(0.4, 0, 0.2, 1),
          box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
      }
      .input::placeholder {
        color: var(--muted-foreground);
      }
      /* focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] */
      .input:focus-visible {
        border-color: var(--ring);
        box-shadow:
          0 0 0 3px rgb(161 161 161 / 0.5),
          0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      /* aria-invalid:ring-destructive/20 aria-invalid:border-destructive */
      .input[aria-invalid="true"] {
        border-color: var(--destructive);
        box-shadow:
          0 0 0 3px rgb(231 0 11 / 0.2),
          0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      .input:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* FormMessage = text-destructive text-sm */
      .message {
        font-size: 14px;
        line-height: 1.4285714;
        color: var(--destructive);
      }

      /* Button = h-9 px-4 py-2 rounded-md text-sm font-medium */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 8px 16px;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: var(--primary);
        color: var(--primary-foreground);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }

      /* Card = rounded-xl border bg-card shadow-sm */
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow:
          0 1px 3px 0 rgb(0 0 0 / 0.1),
          0 1px 2px -1px rgb(0 0 0 / 0.1);
        background: var(--background);
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        margin-bottom: 4px;
      }
      .card-desc {
        font-size: 14px;
        color: var(--muted-foreground);
        margin-bottom: 20px;
      }

      .caption {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        margin-bottom: 10px;
      }
      .cols {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .col {
        width: 340px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
